# Force dark theme at the framework level so the sidebar, widgets,
# and chrome all start dark instead of fighting our injected CSS.
[theme]
base = "dark"
primaryColor = "#f59e0b"
backgroundColor = "#0a0f1f"
secondaryBackgroundColor = "#111827"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = false
